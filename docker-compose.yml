services:
  postgres:
    image: postgres:18
    environment:
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: ledgerline
    ports:
      - "54329:5432"
    command: ["postgres", "-c", "max_connections=300", "-c", "shared_buffers=1GB"]
    volumes:
      - pgdata:/var/lib/postgresql
volumes:
  pgdata:
